services:
  backend:
    build: ./backend
    image: devops-backend:local
    container_name: devops-backend
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: devops-frontend:local
    container_name: devops-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped