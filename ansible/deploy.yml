
---
- name: Deploy Career Path Finder
  hosts: webservers
  become: true

  vars:
    app_dir: /home/ubuntu/Career-path-Finder

  tasks:
    - name: Verify Docker installation
      ansible.builtin.command: docker --version
      become: true
      changed_when: false

    - name: Preserve existing local code changes
      ansible.builtin.command:
        cmd: git stash push -m "preserved-before-automated-deployment"
        chdir: "{{ app_dir }}"
      become_user: ubuntu
      register: result
      changed_when: "'No local changes to save' not in result.stdout"

    - name: Pull latest application code
      ansible.builtin.command:
        cmd: git pull --ff-only origin main
        chdir: "{{ app_dir }}"
      become_user: ubuntu
      register: pull_result
      changed_when: "'Already up to date.' not in pull_result.stdout"

    - name: Build and deploy application containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        build: always
        state: present
        recreate: always
      become: true

    - name: Verify application containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      become: true
      changed_when: false
