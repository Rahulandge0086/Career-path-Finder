
name: Deploy Career Path Finder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.18.6
          ansible-galaxy collection install community.docker
      
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2-key.pem"
          chmod 600 "$HOME/.ssh/ec2-key.pem"

          echo "Checking SSH port..."
          if timeout 10 bash -c 'echo > /dev/tcp/$1/22' _ "$EC2_HOST"; then
            echo "SSH port is reachable"
          else
            echo "SSH port is unreachable; check EC2 security group and EC2_HOST"
            exit 1
          fi

          echo "Retrieving SSH host key..."
          ssh-keyscan -T 10 -H "$EC2_HOST" \
            >> "$HOME/.ssh/known_hosts"

      - name: Create Ansible inventory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ansible
          cat > ansible/ci-inventory.ini <<EOF
          [webservers]
          ec2-server ansible_host=${EC2_HOST} ansible_user=${EC2_USER} ansible_ssh_private_key_file=$HOME/.ssh/ec2-key.pem
          EOF

      - name: Run Ansible deployment
        run: |
          ansible-playbook \
            -i ansible/ci-inventory.ini \
            ansible/deploy.yml
